- name: Configure Nginx HTTPS
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    mode: 0644
  notify: Reload Nginx

- name: Ensure Nginx is running
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true

- name: Validate Nginx configuration
  ansible.builtin.command: nginx -t
  changed_when: false