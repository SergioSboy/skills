---
- name: Ensure UFW is installed
  ansible.builtin.apt:
    name: ufw
    state: present
    update_cache: yes

- name: Allow incoming SSH traffic before applying default deny
  community.general.ufw:
    rule: allow
    port: '22'
    proto: tcp
    comment: "Allow SSH access"

- name: Allow incoming traffic on loopback interface
  community.general.ufw:
    rule: allow
    interface: lo
    direction: in
    comment: "Allow loopback"

- name: Set default incoming policy to DENY
  community.general.ufw:
    default: deny
    direction: incoming

- name: Set default outgoing policy to ALLOW
  community.general.ufw:
    default: allow
    direction: outgoing

- name: Enable UFW service
  community.general.ufw:
    state: enabled