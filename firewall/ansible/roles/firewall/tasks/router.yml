---
- name: Enable IPv4 forwarding in sysctl
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: '1'
    sysctl_set: true
    state: present
    reload: true

- name: Install nftables package
  ansible.builtin.apt:
    name: nftables
    state: present
    update_cache: true

- name: Deploy nftables configuration
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: '0750'
  notify: Restart nftables

- name: Ensure nftables service is enabled and running
  ansible.builtin.systemd:
    name: nftables
    state: started
    enabled: true